# Thử nghiệm thăm dò: giống cifar10_noisy_resnet32_authordefaults.yaml (nesterov True, gradient clipping 5.0)
# nhưng weight decay 1e-3 (mặc định của code SAM chính thức; Table 6 chỉ dùng 1e-3 cho WRN 28-10 1800 epoch và ShakeShake).
# Bài SAM không nêu wd cho thí nghiệm nhiễu; wd 1e-3 riêng lẻ trước đó cho 30.2% (so với 55.4% của 5e-4).
experiment: cifar10_noisy_resnet32_authordefaults_wd1e3
dataset: cifar10
data_root: data
model: resnet32
num_classes: 10
augmentation: basic
seed: 1

label_noise:
  rates: [0.2, 0.4, 0.6, 0.8]
  noise_seed_offset: 1000

split:
  validation_fraction: 0.0
  seed: 1

training:
  epochs: 200
  batch_size: 256
  gradient_accumulation_steps: 1
  num_micro_batches: 1
  effective_batch_size: 256
  num_workers: 8
  learning_rate: 0.1
  weight_decay: 0.001
  scheduler: cosine
  momentum: 0.9
  nesterov: true
  label_smoothing: 0.0
  gradient_clip_norm: 5.0

sam:
  rho_by_noise_rate:
    0.2: 0.1
    0.4: 0.1
    0.6: 0.1
    0.8: 0.05

mixup:
  alphas: [1, 8, 16, 32]

output_root: outputs/authordefaults_wd1e3
