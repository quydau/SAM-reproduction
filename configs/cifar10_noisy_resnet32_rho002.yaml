# Thử nghiệm thăm dò: giống cifar10_noisy_resnet32_train50k.yaml (batch 256, wd 5e-4, 50k, không chia micro-batch)
# nhưng rho ở 80% nhiễu = 0.02 (thay vì 0.05 của bài). 0.02 nằm trong lưới ρ {0.01,0.02,0.05,0.1,0.2,0.5} của SAM §3.1.
# Các mức nhiễu khác giữ nguyên rho 0.1.
experiment: cifar10_noisy_resnet32_rho002
dataset: cifar10
data_root: data
model: resnet32
num_classes: 10
augmentation: basic
seed: 1

label_noise:
  rates: [0.2, 0.4, 0.6, 0.8]
  noise_seed_offset: 1000

split:
  validation_fraction: 0.0
  seed: 1

training:
  epochs: 200
  batch_size: 256
  gradient_accumulation_steps: 1
  num_micro_batches: 1
  effective_batch_size: 256
  num_workers: 8
  learning_rate: 0.1
  weight_decay: 0.0005
  scheduler: cosine
  momentum: 0.9
  nesterov: false
  label_smoothing: 0.0
  gradient_clip_norm: 0.0

sam:
  rho_by_noise_rate:
    0.2: 0.1
    0.4: 0.1
    0.6: 0.1
    0.8: 0.02

mixup:
  alphas: [1, 8, 16, 32]

output_root: outputs/rho002
