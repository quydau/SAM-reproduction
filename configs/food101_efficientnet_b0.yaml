experiment: food101_efficientnet_b0
dataset: food101
data_root: data
model: efficientnet_b0
num_classes: 101
optimizers: [sgd, sam]
seed: 1

split:
  validation_fraction: 0.1
  seed: 1

training:
  # Match the Flowers102 B0 recipe: effective batch 1024 via 64 x 16 accumulation.
  batch_size: 64
  gradient_accumulation_steps: 16
  effective_batch_size: 1024
  epochs: null
  max_steps: 5000
  mixed_precision: fp16
  channels_last: true
  cudnn_benchmark: true
  learning_rate: 0.016
  scheduler: cosine
  weight_decay: 0.00001
  momentum: 0.9
  nesterov: true
  label_smoothing: 0.1
  gradient_clip_norm: 1.0
  freeze_batch_norm_statistics: true
  evaluate_every: 10
  checkpoint_every: 50

sam:
  rho: 0.05

pretrained_weights: IMAGENET1K_V1
replace_classifier: true
image:
  crop_size: 224
  eval_center_crop_fraction: 0.875
  interpolation: bicubic
  normalization: imagenet
  train_preprocessing: sam_center_crop_then_resize_no_augmentation
  eval_preprocessing: sam_center_crop_then_resize

# Food101 supplies official train/test splits. A fixed stratified 10% of the
# official train split is reserved for validation; train/val/test use the same
# deterministic center-crop, bicubic resize, and ImageNet normalization.

output_root: outputs
