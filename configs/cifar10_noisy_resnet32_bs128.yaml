# Thử nghiệm chẩn đoán: giống cifar10_noisy_resnet32_train50k.yaml (weight decay 5e-4, theo Bảng 6 của SAM)
# nhưng batch_size = 128 theo code Jiang et al. 2019 (--batch_size=128), vì SAM §3.3 viết "following Jiang et al.".
# Chỉ đổi MỘT biến (batch) để tách ảnh hưởng; lệch khỏi phụ lục C.1 của SAM (batch 256) -> chỉ là thăm dò.
experiment: cifar10_noisy_resnet32_bs128
dataset: cifar10
data_root: data
model: resnet32
num_classes: 10
augmentation: basic
seed: 1

label_noise:
  rates: [0.2, 0.4, 0.6, 0.8]
  noise_seed_offset: 1000

split:
  validation_fraction: 0.0
  seed: 1

training:
  epochs: 200
  batch_size: 128
  gradient_accumulation_steps: 1
  num_micro_batches: 1
  effective_batch_size: 128
  num_workers: 8
  learning_rate: 0.1
  weight_decay: 0.0005
  scheduler: cosine
  momentum: 0.9
  nesterov: false
  label_smoothing: 0.0
  gradient_clip_norm: 0.0

sam:
  rho_by_noise_rate:
    0.2: 0.1
    0.4: 0.1
    0.6: 0.1
    0.8: 0.05

mixup:
  alphas: [1, 8, 16, 32]

output_root: outputs/bs128
