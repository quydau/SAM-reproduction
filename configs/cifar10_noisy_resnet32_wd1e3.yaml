# Thử nghiệm chẩn đoán (KHÔNG phải giá trị từ bài báo): giống cifar10_noisy_resnet32_train50k.yaml
# nhưng weight_decay = 1e-3. Căn cứ: Bảng 6 phụ lục C.1 của bài SAM dùng WD 5e-4 đến 1e-3 cho CIFAR.
# Kết quả đã có ở 80% nhiễu: WD 2e-4 -> 41.3, WD 5e-4 -> 55.4.
experiment: cifar10_noisy_resnet32_wd1e3
dataset: cifar10
data_root: data
model: resnet32
num_classes: 10
augmentation: basic
seed: 1

label_noise:
  rates: [0.2, 0.4, 0.6, 0.8]
  noise_seed_offset: 1000

split:
  validation_fraction: 0.0
  seed: 1

training:
  epochs: 200
  batch_size: 256
  gradient_accumulation_steps: 1
  num_micro_batches: 1
  effective_batch_size: 256
  num_workers: 8
  learning_rate: 0.1
  weight_decay: 0.001
  scheduler: cosine
  momentum: 0.9
  nesterov: false
  label_smoothing: 0.0
  gradient_clip_norm: 0.0

sam:
  rho_by_noise_rate:
    0.2: 0.1
    0.4: 0.1
    0.6: 0.1
    0.8: 0.05

mixup:
  alphas: [1, 8, 16, 32]

output_root: outputs/wd1e3
