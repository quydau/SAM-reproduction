experiment: stanford_cars_efficientnet_b4_jft
dataset: stanford_cars
data_root: data
model: efficientnet_b4_jft
num_classes: 196
optimizers: [sgd, sam]
seed: 1

split:
  validation_fraction: 0.1
  seed: 1

training:
  # RTX 3080 10 GB: larger physical batches improve throughput at 380px.
  batch_size: 32
  gradient_accumulation_steps: 32
  effective_batch_size: 1024
  epochs: null
  max_steps: 5000
  mixed_precision: fp16
  channels_last: true
  cudnn_benchmark: true
  learning_rate: 0.016
  scheduler: cosine
  weight_decay: 0.00001
  momentum: 0.9
  nesterov: true
  label_smoothing: 0.1
  gradient_clip_norm: 1.0
  freeze_batch_norm_statistics: true
  evaluate_every: 10
  checkpoint_every: 50

sam:
  rho: 0.05

pretrained_weights: tf_efficientnet_b4.ns_jft_in1k
replace_classifier: true
image:
  crop_size: 380
  interpolation: bicubic
  normalization: model_default
  train_preprocessing: sam_center_crop_then_resize_no_augmentation
  eval_preprocessing: sam_center_crop_then_resize

output_root: outputs
